name: knowledge-tests

# CI for the Knowledge service (ADR-0027). Installs deps in services/knowledge and
# runs storage + shared cross-driver contract + delivery + API + import + migration
# tests. Fails the PR on any test failure.
#
# NO production secrets are required: the durable libSQL driver is exercised in a
# secret-free in-memory mode via the shared storage contract suite, the API tests
# supply a temporary internal secret in-process, and all fixtures use in-memory
# databases that are discarded when the runner exits. An optional credentialed
# remote Turso smoke test is documented separately and is NOT part of ordinary CI.

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'services/knowledge/**'
      - 'netlify/functions/knowledge.js'
      - 'research/austin/**'
      - '.github/workflows/knowledge-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/knowledge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run migrations (smoke, in-memory sqlite)
        run: npm run migrate -- ':memory:'

      - name: Readiness check (in-memory sqlite, schema only)
        run: npm run readiness -- ':memory:' || true

      - name: Run tests (storage + contract + delivery + api + import + migration)
        run: npm test
